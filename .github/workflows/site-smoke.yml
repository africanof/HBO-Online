name: Teste do site publicado

# Só corre quando alguém carrega em "Run workflow" (não gasta nada automaticamente).
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Endereço do site"
        required: false
        default: "https://huambo-na-m-o.onrender.com"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Testar páginas
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: node scripts/smoke-site.mjs
      - name: Capturas das páginas com problemas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: smoke_*.png
          if-no-files-found: ignore
