name: Configurar endereços de autenticação do Supabase

# Só corre quando alguém carrega em "Run workflow".
# Precisa do segredo SUPABASE_ACCESS_TOKEN (chave pessoal do Supabase, criada pelo dono).
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Endereço do site"
        required: false
        default: "https://huambo-online.vercel.app"
      extra_site_urls:
        description: "Outros endereços autorizados, separados por vírgulas (ex.: o antigo, durante uma mudança)"
        required: false
        default: "https://huambo-na-m-o.onrender.com"
      leaked_password_protection:
        description: "Recusar palavras-passe que já apareceram em fugas de dados (HaveIBeenPwned)"
        type: boolean
        required: false
        default: true

jobs:
  auth-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: pewymvkowbdizdiyjmao
      SITE_URL: ${{ inputs.site_url }}
      EXTRA_SITE_URLS: ${{ inputs.extra_site_urls }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Verificar segredo
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings → Secrets and variables → Actions)."; exit 1
          fi
      - name: Definir Site URL e Redirect URLs
        run: |
          # Endereço principal + outros endereços (cada um com /**) + a APP (huamboonline://)
          body=$(jq -n --arg site "${SITE_URL%/}" --arg extra "$EXTRA_SITE_URLS" '
            ([$site] + ($extra | split(",") | map(gsub("^\\s+|\\s+$"; "") | sub("/$"; "")) | map(select(length > 0))))
            | unique | map(. + "/**") + ["huamboonline://**"]
            | {site_url: $site, uri_allow_list: join(",")}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          echo "Resposta HTTP: $code"
          if [ "$code" -ge 300 ]; then jq -r '.message // .' resp.json; exit 1; fi
      - name: Proteção contra palavras-passe expostas
        if: ${{ inputs.leaked_password_protection }}
        # Em alguns planos do Supabase esta opção não está disponível: avisa, mas não falha.
        continue-on-error: true
        run: |
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d '{"password_hibp_enabled": true}')
          echo "Resposta HTTP: $code"
          if [ "$code" -ge 300 ]; then echo "Não foi possível ativar:"; jq -r '.message // .' resp.json; exit 1; fi
      - name: Confirmar
        run: |
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq '{site_url, uri_allow_list, mailer_autoconfirm, external_email_enabled, password_hibp_enabled}'
