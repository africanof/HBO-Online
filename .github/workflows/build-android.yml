name: APP Android (EAS)

# Só corre quando o dono carrega em «Run workflow» (nunca sozinho: cada compilação gasta créditos da Expo).
# Precisa do segredo EXPO_TOKEN no GitHub (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview = APK para instalar e testar · production = AAB para a Google Play"
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar o EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta o segredo EXPO_TOKEN (crie-o em expo.dev → Account settings → Access tokens e junte-o aos segredos do GitHub)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos e testes antes de gastar créditos
        run: pnpm typecheck && pnpm test

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Ligar ao projeto na conta Expo (cria-o na primeira vez)
        working-directory: apps/mobile
        run: eas init --non-interactive --force

      - name: Pedir a compilação (${{ inputs.profile }})
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
