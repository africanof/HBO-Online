name: Cópia no GitLab

# Sempre que algo é enviado para o GitHub, envia o mesmo para o repositório do GitLab
# (todos os ramos e etiquetas). Assim o GitLab fica sempre igual, sem migrar outra vez.
# Precisa de dois segredos no GitHub (Settings → Secrets and variables → Actions):
#   GITLAB_REPO  — o caminho do projeto no GitLab, ex.: «utilizador/hbo-online»
#   GITLAB_TOKEN — um token de acesso do GitLab com a permissão «write_repository»
# Sem os segredos não faz nada (não falha).
on:
  push:
  workflow_dispatch:

concurrency:
  group: espelho-gitlab
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - name: Ver se está configurado
        id: cfg
        env:
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_REPO" ] || [ -z "$GITLAB_TOKEN" ]; then
            echo "Faltam os segredos GITLAB_REPO e/ou GITLAB_TOKEN: nada a copiar."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - name: Enviar para o GitLab
        if: steps.cfg.outputs.ok == 'true'
        env:
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # Limpa o que costuma vir colado por engano: espaços, «https://gitlab.com/», «.git», «/» no fim.
          TOKEN="$(printf '%s' "$GITLAB_TOKEN" | tr -d '[:space:]')"
          REPO="$(printf '%s' "$GITLAB_REPO" | tr -d '[:space:]' | sed -E 's#^https?://##; s#^gitlab\.com/##; s#\.git$##; s#/+$##')"
          echo "::add-mask::$TOKEN"
          echo "Projeto no GitLab: $REPO"

          case "$REPO" in
            github.com/*|*github*) echo "::error::GITLAB_REPO tem um endereço do GitHub («$REPO»). Tem de ser o caminho do projeto NO GITLAB (o que vem depois de gitlab.com/)."; exit 1;;
          esac

          # O token chega ao projeto? (um token só com «write_repository» não pode usar a API, por isso testamos com o próprio git)
          if ! git ls-remote "https://oauth2:${TOKEN}@gitlab.com/${REPO}.git" >/dev/null 2>/tmp/ls.err; then
            echo "::error::O GitLab recusou o acesso a «$REPO»: $(tr -d '\n' </tmp/ls.err | sed "s#${TOKEN}#***#g"). Confirme que o projeto existe nesse caminho e que o token tem «write_repository» (ou «Repository: read and write»)."
            exit 1
          fi
          echo "Acesso ao projeto confirmado."

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git remote set-head origin -d 2>/dev/null || true
          git remote add gitlab "https://oauth2:${TOKEN}@gitlab.com/${REPO}.git"
          # Todos os ramos do GitHub e todas as etiquetas (só acrescenta: não apaga nada no GitLab).
          if ! git push gitlab 'refs/remotes/origin/*:refs/heads/*' 'refs/tags/*:refs/tags/*'; then
            echo "::error::O GitLab recusou o envio. Se o erro for 403: o token não tem permissão de escrita (scope «write_repository», ou no token novo «Repository: read and write»). Se for «protected branch»: o ramo está protegido contra alterações vindas de fora."
            exit 1
          fi
          echo "GitLab atualizado: https://gitlab.com/${REPO}"
